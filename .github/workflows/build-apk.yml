name: Build APK

# Cada push a main (o "Run workflow" a mano) compila el APK firmado
# y lo publica como Release "vN" con el archivo coraz-ventas.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restaurar llave de firma (si está el secreto)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/coraz-widget.jks
            echo "Firma fija restaurada"
          else
            echo "Sin secreto KEYSTORE_B64: se firma con llave debug"
          fi

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk coraz-ventas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coraz-ventas-apk
          path: coraz-ventas.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" coraz-ventas.apk \
            --title "CORAZ Ventas 1.0.${{ github.run_number }}" \
            --notes "Build automático de ${{ github.sha }}. Instalá coraz-ventas.apk encima de la versión anterior."
